<!-- Phaser is a classic script, not a module: it defines the global `Phaser`.
     Classic scripts run before module scripts, which are deferred, so main.js
     can rely on `Phaser` already existing without importing anything. -->
<script src="phaser.min.js"></script>
<script type="module" src="main.js?v=0.10.0"></script>

<!-- The service worker keeps the game playable offline and swaps in a new build
     the moment it exists, so an old copy can never hold the screen. On the very
     first visit it claims the page; afterwards a new worker reloads once by
     itself. -->
<script>
  (function () {
    if (!('serviceWorker' in navigator)) return;

    var hadController = Boolean(navigator.serviceWorker.controller);

    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register('sw.js', { updateViaCache: 'none' })
        .then(function (registration) {
          registration.update();

          registration.addEventListener('updatefound', function () {
            var worker = registration.installing;
            if (!worker) return;

            worker.addEventListener('statechange', function () {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                worker.postMessage('SKIP_WAITING');
              }
            });
          });
        })
        .catch(function () {
          // Private mode or an old browser: the game runs as it always has.
        });

      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || reloading) return;
        reloading = true;
        window.location.reload();
      });
    });
  })();
</script>


<!-- The game compares the build it was served with against the published one.
     A page that arrives from an old cache notices, reloads itself once and
     comes back with the new build, so a lagging copy heals on its own. -->
<script>
  (function () {
    var BUILD = '0.10.0';
    var attempts = 0;

    try {
      attempts = Number(sessionStorage.getItem('build-reloads') || 0);
    } catch (error) {
      attempts = 0;
    }

    if (attempts > 2) return;

    fetch('game.json?ts=' + Date.now(), { cache: 'no-store' })
      .then(function (response) {
        return response.ok ? response.json() : null;
      })
      .then(function (data) {
        if (!data || !data.version || data.version === BUILD) {
          try {
            sessionStorage.removeItem('build-reloads');
          } catch (error) {
            // Storage unavailable; nothing to clear.
          }
          return;
        }

        try {
          sessionStorage.setItem('build-reloads', String(attempts + 1));
        } catch (error) {
          return;
        }

        window.location.reload();
      })
      .catch(function () {
        // Offline or blocked: the service worker's copy is what plays.
      });
  })();
</script>
